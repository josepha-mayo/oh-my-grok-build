[package]
name = "oh-my-grok-build"
version = "0.1.0"
edition.workspace = true
autobins = false
build = "build.rs"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Opinionated productivity, orchestration, and mobile-relay layer on top of Grok Build."
keywords = ["cli", "ai", "agent", "grok", "xai"]
categories = ["command-line-utilities", "development-tools"]
default-run = "omgb"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["ws"] }
base64 = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }
blake3 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
constant_time_eq = { workspace = true }
crossterm = { workspace = true }
dirs = { workspace = true }
dunce = { workspace = true }
flate2 = { workspace = true }
fs2 = { workspace = true }
gethostname = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }
libc = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
serde = { workspace = true, features = ["derive"] }
shlex = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tempfile = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
quick-xml = { workspace = true }
qrcode = { workspace = true }
ratatui = { workspace = true }
scraper = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
which = { workspace = true }
xai-crash-handler = { path = "../codegen/xai-crash-handler" }
xai-grok-config = { path = "../codegen/xai-grok-config" }
xai-grok-pager = { path = "../codegen/xai-grok-pager" }
xai-grok-pager-minimal = { path = "../codegen/xai-grok-pager-minimal" }
xai-grok-shell = { path = "../codegen/xai-grok-shell" }
xai-grok-tools = { path = "../codegen/xai-grok-tools" }
xai-grok-voice = { path = "../codegen/xai-grok-voice", default-features = false }
xai-tty-utils = { path = "../codegen/xai-tty-utils" }
xai-tool-protocol = { path = "../common/xai-tool-protocol" }
xai-tool-runtime = { path = "../common/xai-tool-runtime" }
xai-tool-types = { path = "../common/xai-tool-types" }
croner = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
filetime = { workspace = true }

[[bin]]
name = "omgb"
path = "src/bin/omgb.rs"

[[bin]]
name = "safe-shell-guard"
path = "src/bin/safe_shell_guard.rs"

[lints]
workspace = true
