name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            clippy: cargo clippy --workspace --all-targets
            test: cargo test -p oh-my-grok-build
          - os: macos-latest
            clippy: cargo clippy --workspace --all-targets
            test: cargo test -p oh-my-grok-build
          - os: windows-latest
            clippy: cargo clippy -p oh-my-grok-build --all-targets
            test: cargo test -p oh-my-grok-build
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - run: cargo fmt --check -p oh-my-grok-build
      - run: ${{ matrix.clippy }}
      - run: ${{ matrix.test }}
      - name: Build and install safe-shell-guard hook binary
        shell: bash
        run: |
          cargo build -p oh-my-grok-build --bin safe-shell-guard
          mkdir -p plugin/bin
          for f in target/debug/safe-shell-guard target/debug/safe-shell-guard.exe; do
            if [ -f "$f" ]; then cp "$f" plugin/bin/; fi
          done

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
      - uses: swatinem/rust-cache@v2
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
